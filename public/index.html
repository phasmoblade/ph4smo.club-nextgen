<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ph4smo.club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 3em;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 50px;
            font-size: 1.1em;
        }
        
        .loadstring-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .loadstring-box:hover {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        
        .loadstring-code {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #68d391;
            word-break: break-all;
            margin-bottom: 15px;
            border: 1px solid #222;
        }
        
        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .copy-btn.copied {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }
        
        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer a:hover {
            color: #764ba2;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .logo {
                font-size: 2.5em;
            }
            
            .loadstring-code {
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🪓</div>
        <h1>ph4smo.club (next generation)</h1>
        <p class="subtitle">roblox script hub</p>
        
        <div class="loadstring-box">
            <div class="loadstring-code" id="loadstring">loadstring(game:HttpGet("https://ph4smoclub.vercel.app/api/loader"))()</div>
            <button class="copy-btn" onclick="copyLoadstring()">copy</button>
        </div>
        
        <div class="footer">
            made with ❤️ by <a href="https://github.com/phasmoblade" target="_blank">phasmoblade</a>
        </div>
    </div>
    
    <script>
        function copyLoadstring() {
            const text = document.getElementById('loadstring').textContent;
            const btn = event.target;
            
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = 'Copy Loadstring';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                btn.textContent = 'Failed to copy';
                setTimeout(() => {
                    btn.textContent = 'Copy Loadstring';
                }, 2000);
            });
        }
    </script>
</body>
</html>
