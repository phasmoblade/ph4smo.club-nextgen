<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ph4smo loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            cursor: none;
            padding: 80px 20px 40px;
        }
        
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(99,102,241,.6);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
        }
        
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: #6366f1;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 80px;
        }
        
        .title {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 0.9;
            margin-bottom: 16px;
        }
        
        .title-main {
            display: block;
            color: #fff;
        }
        
        .title-sub {
            display: block;
            color: #333;
        }
        
        .subtitle {
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }
        
        .script-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .script-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        
        .script-card:hover {
            border-color: rgba(99,102,241,0.3);
            background: rgba(255,255,255,0.04);
            transform: translateY(-4px);
        }
        
        .script-card:hover::before {
            transform: scaleX(1);
        }
        
        .script-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        
        .script-desc {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }
        
        .footer {
            text-align: center;
            color: #444;
            font-size: 0.85rem;
            margin-top: 60px;
        }
        
        .footer a {
            color: #6366f1;
            text-decoration: none;
        }
        
        @media (max-width: 768px) {
            .scripts-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">
                <span class="title-main">PH4SMO</span>
                <span class="title-sub">select script</span>
            </h1>
            <p class="subtitle">script hub</p>
        </div>
        
        <div class="scripts-grid">
            <div class="script-card" onclick="load('arsenal')">
                <div class="script-name">Arsenal</div>
                <div class="script-desc">aimbot, esp, movement</div>
            </div>
            
            <div class="script-card" onclick="load('doors')">
                <div class="script-name">Doors</div>
                <div class="script-desc">esp, fullbright, speed</div>
            </div>
            
            <div class="script-card" onclick="load('ninja-legends')">
                <div class="script-name">Ninja Legends</div>
                <div class="script-desc">auto farm, auto sell</div>
            </div>
            
            <div class="script-card" onclick="load('steel-titans')">
                <div class="script-name">Steel Titans</div>
                <div class="script-desc">auto farm, auto rebirth</div>
            </div>
            
            <div class="script-card" onclick="load('ftap')">
                <div class="script-name">Find The Animals</div>
                <div class="script-desc">esp, teleport</div>
            </div>
            
            <div class="script-card" onclick="load('bite-by-night')">
                <div class="script-name">Bite By Night</div>
                <div class="script-desc">auto farm, auto quest</div>
            </div>
        </div>
        
        <div class="footer">
            by <a href="https://github.com/phasmoblade">phasmoblade</a>
        </div>
    </div>
    
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = (e.clientX + 8) + 'px';
            cursorDot.style.top = (e.clientY + 8) + 'px';
        });
        
        document.querySelectorAll('.script-card, a').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
            });
        });
        
        function load(script) {
            console.log('Loading:', script);
        }
    </script>
</body>
</html>
