<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ph4smo.club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            cursor: none;
        }
        
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
        }
        
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .title-wrapper {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .title {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
        }
        
        .loadstring-card {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        
        .code-wrapper {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
        }
        
        .code-header {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }
        
        .code-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
        }
        
        .code-text {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #999;
            line-height: 1.6;
            word-break: break-all;
        }
        
        .copy-btn {
            width: 100%;
            padding: 16px;
            background: #fff;
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }
        
        .copy-btn:hover {
            background: #e5e5e5;
            transform: translateY(-2px);
        }
        
        .copy-btn.copied {
            background: #10b981;
            color: #fff;
        }
        
        @media (max-width: 768px) {
            .loadstring-card {
                padding: 30px 20px;
            }
            
            .code-wrapper {
                padding: 20px;
            }
            
            .code-text {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    
    <div class="hero">
        <div class="title-wrapper">
            <h1 class="title">ph4smo.club</h1>
            <p class="subtitle">roblox script hub</p>
        </div>
        
        <div class="loadstring-card">
            <div class="code-wrapper">
                <div class="code-header">
                    <div class="code-dot"></div>
                    <div class="code-dot"></div>
                    <div class="code-dot"></div>
                </div>
                <div class="code-text" id="code">loadstring(game:HttpGet("https://ph4smoclub.vercel.app/api/loader"))()</div>
            </div>
            <button class="copy-btn" onclick="copy()">copy</button>
        </div>
    </div>
    
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = (e.clientX + 8) + 'px';
            cursorDot.style.top = (e.clientY + 8) + 'px';
        });
        
        document.querySelectorAll('button').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
            });
        });
        
        function copy() {
            const text = document.getElementById('code').textContent;
            const btn = event.target;
            
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'copied!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = 'copy';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }
    </script>
</body>
</html>
