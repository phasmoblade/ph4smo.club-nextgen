<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supported Games - ph4smo.club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            cursor: none;
        }
        
        @media (max-width: 768px) {
            body {
                cursor: auto;
            }
            
            .cursor, .cursor-dot {
                display: none;
            }
        }
        
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
        }
        
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .title {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
        }
        
        .games-list {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        
        .game-item {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1.1rem;
            color: #ccc;
            transition: color 0.2s;
        }
        
        .game-item:last-child {
            border-bottom: none;
        }
        
        .game-item:hover {
            color: #fff;
        }
        
        .back-link {
            margin-top: 40px;
            text-align: center;
        }
        
        .back-link a {
            color: #999;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            transition: color 0.2s;
            cursor: pointer;
        }
        
        .back-link a:hover {
            color: #fff;
        }
        
        @media (max-width: 768px) {
            .games-list {
                padding: 30px 20px;
            }
            
            .game-item {
                font-size: 1rem;
                padding: 16px 0;
            }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">ph4smo.club</h1>
            <p class="subtitle">supported games</p>
        </div>
        
        <div class="games-list">
            <div class="game-item">Bite By Night</div>
            <div class="game-item">Doors</div>
            <div class="game-item">Flick</div>
            <div class="game-item">FTAP (Fling Things And People)</div>
            <div class="game-item">Ninja Legends</div>
            <div class="game-item">Spin a Baddie</div>
            <div class="game-item">Steel Titans</div>
        </div>
        
        <div class="back-link">
            <a href="/">← BACK TO HOME</a>
        </div>
    </div>
    
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = (e.clientX + 8) + 'px';
            cursorDot.style.top = (e.clientY + 8) + 'px';
        });
        
        document.querySelectorAll('a').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
