<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - ph4smo.club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            cursor: none;
        }
        
        @media (max-width: 768px) {
            body {
                cursor: auto;
            }
            
            .cursor, .cursor-dot {
                display: none;
            }
        }
        
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
        }
        
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .title-wrapper {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .title {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
        }
        
        .games-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .game-card:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.04);
            transform: translateY(-4px);
        }
        
        .game-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .game-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
        }
        
        .back-link {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        @media (max-width: 768px) {
            .games-container {
                padding: 30px 20px;
            }
            
            .back-link {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    
    <a href="/" class="back-link">← back</a>
    
    <div class="hero">
        <div class="title-wrapper">
            <h1 class="title">supported games</h1>
            <p class="subtitle">select a game</p>
        </div>
        
        <div class="games-container">
            <div class="games-grid">
                <div class="game-card" onclick="copyLoadstring('bite-by-night')">
                    <div class="game-name">bite by night</div>
                    <div class="game-desc">auto farm • auto quest • speed</div>
                </div>
                
                <div class="game-card" onclick="copyLoadstring('doors')">
                    <div class="game-name">doors</div>
                    <div class="game-desc">esp • fullbright • speed</div>
                </div>
                
                <div class="game-card" onclick="copyLoadstring('ftap')">
                    <div class="game-name">find the animals</div>
                    <div class="game-desc">esp • teleport • speed</div>
                </div>
                
                <div class="game-card" onclick="copyLoadstring('ninja-legends')">
                    <div class="game-name">ninja legends</div>
                    <div class="game-desc">auto farm • auto sell • speed</div>
                </div>
                
                <div class="game-card" onclick="copyLoadstring('spin-a-baddie')">
                    <div class="game-name">spin a baddie</div>
                    <div class="game-desc">auto farm • auto rebirth</div>
                </div>
                
                <div class="game-card" onclick="copyLoadstring('steel-titans')">
                    <div class="game-name">steel titans</div>
                    <div class="game-desc">auto farm • auto rebirth • speed</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = (e.clientX + 8) + 'px';
            cursorDot.style.top = (e.clientY + 8) + 'px';
        });
        
        document.querySelectorAll('.game-card').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
            });
        });
        
        function copyLoadstring(game) {
            const loadstring = `loadstring(game:HttpGet("https://ph4smoclub.vercel.app/api/loader"))()`;
            navigator.clipboard.writeText(loadstring).then(() => {
                const btn = event.target.closest('.game-card');
                const originalText = btn.querySelector('.game-name').textContent;
                btn.querySelector('.game-name').textContent = 'copied!';
                setTimeout(() => {
                    btn.querySelector('.game-name').textContent = originalText;
                }, 1500);
            });
        }
    </script>
</body>
</html>
